<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#eef2f7" />
    <title>CommandsCenter</title>
    <script>
      (() => {
        const root = document.documentElement;
        let preference = null;
        let legacyTheme = null;

        try {
          preference = window.localStorage.getItem("cc.color-mode");
          legacyTheme = window.localStorage.getItem("cc.theme");
        } catch {}

        if (preference !== "light" && preference !== "dark" && preference !== "system") {
          preference = legacyTheme === "light" || legacyTheme === "dark" ? legacyTheme : "system";

          if (legacyTheme === "modern") {
            preference = "dark";
          }

          try {
            window.localStorage.setItem("cc.color-mode", preference);
            window.localStorage.removeItem("cc.theme");
          } catch {}
        }

        const systemColorMode =
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        const resolvedColorMode = preference === "system" ? systemColorMode : preference;

        root.setAttribute("data-theme", "default");
        root.setAttribute("data-color-mode", resolvedColorMode);
        root.style.colorScheme = resolvedColorMode;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
