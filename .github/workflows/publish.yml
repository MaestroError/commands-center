name: Publish

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish commandscenter to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate trusted publishing toolchain
        run: |
          set -euo pipefail
          node --version
          npm --version
          node --input-type=module <<'EOF'
          import { execFileSync } from 'node:child_process';

          const [nodeMajor, nodeMinor] = process.versions.node.split('.').map(Number);
          if (nodeMajor < 22 || (nodeMajor === 22 && nodeMinor < 14)) {
            throw new Error(`npm trusted publishing requires Node.js 22.14.0 or newer, found ${process.version}`);
          }

          const npmVersion = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim();
          const [npmMajor, npmMinor, npmPatch] = npmVersion.split('.').map(Number);
          if (
            npmMajor < 11 ||
            (npmMajor === 11 && (npmMinor < 5 || (npmMinor === 5 && npmPatch < 1)))
          ) {
            throw new Error(`npm trusted publishing requires npm 11.5.1 or newer, found ${npmVersion}`);
          }
          EOF

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag format
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must match vX.Y.Z"
            exit 1
          fi
          TAG_VERSION="${RELEASE_TAG#v}"
          echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate package version matches tag
        id: pkg
        env:
          TAG_VERSION: ${{ steps.tag.outputs.tag_version }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          echo "pkg_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$PKG_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::Release tag version '$TAG_VERSION' does not match packages/cli/package.json version '$PKG_VERSION'"
            exit 1
          fi

      - name: Validate package repository URL matches GitHub origin
        env:
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail
          PKG_REPOSITORY_URL="$(node -p "require('./packages/cli/package.json').repository?.url || ''")"
          normalize_repo_url() {
            local value="$1"
            value="${value#git+}"
            value="${value%.git}"
            printf '%s\n' "$value"
          }
          EXPECTED_REPOSITORY_URL="https://github.com/${GITHUB_REPOSITORY_NAME}"
          if [[ -z "$PKG_REPOSITORY_URL" ]]; then
            echo "::error::packages/cli/package.json must define repository.url for npm trusted publishing"
            exit 1
          fi
          if [[ "$(normalize_repo_url "$PKG_REPOSITORY_URL")" != "$EXPECTED_REPOSITORY_URL" ]]; then
            echo "::error::packages/cli/package.json repository.url '$PKG_REPOSITORY_URL' does not match GitHub repository '$EXPECTED_REPOSITORY_URL'"
            exit 1
          fi

      - name: Fail if version already published
        env:
          PKG_VERSION: ${{ steps.pkg.outputs.pkg_version }}
        run: |
          set -euo pipefail
          if npm view "commandscenter@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "::error::commandscenter@${PKG_VERSION} is already published to npm"
            exit 1
          fi

      - name: Run publish gate
        run: pnpm release:check

      - name: Publish to npm with trusted publishing
        working-directory: packages/cli
        run: npm publish --access public

      - name: Pack tarball for release asset
        id: pack
        working-directory: packages/cli
        env:
          PKG_VERSION: ${{ steps.pkg.outputs.pkg_version }}
        run: |
          set -euo pipefail
          npm pack
          echo "tarball=packages/cli/commandscenter-${PKG_VERSION}.tgz" >> "$GITHUB_OUTPUT"

      - name: Upload tarball to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: gh release upload "$RELEASE_TAG" "$TARBALL" --clobber
