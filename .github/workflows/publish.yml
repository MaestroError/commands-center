name: Publish

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish commandscenter to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag format
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must match vX.Y.Z"
            exit 1
          fi
          TAG_VERSION="${RELEASE_TAG#v}"
          echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate package version matches tag
        id: pkg
        env:
          TAG_VERSION: ${{ steps.tag.outputs.tag_version }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          echo "pkg_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$PKG_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::Release tag version '$TAG_VERSION' does not match packages/cli/package.json version '$PKG_VERSION'"
            exit 1
          fi

      - name: Fail if version already published
        env:
          PKG_VERSION: ${{ steps.pkg.outputs.pkg_version }}
        run: |
          set -euo pipefail
          if npm view "commandscenter@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "::error::commandscenter@${PKG_VERSION} is already published to npm"
            exit 1
          fi

      - name: Run publish gate
        run: pnpm release:check

      - name: Publish to npm with trusted publishing
        working-directory: packages/cli
        run: npm publish --access public

      - name: Pack tarball for release asset
        id: pack
        working-directory: packages/cli
        env:
          PKG_VERSION: ${{ steps.pkg.outputs.pkg_version }}
        run: |
          set -euo pipefail
          npm pack
          echo "tarball=packages/cli/commandscenter-${PKG_VERSION}.tgz" >> "$GITHUB_OUTPUT"

      - name: Upload tarball to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: gh release upload "$RELEASE_TAG" "$TARBALL" --clobber
